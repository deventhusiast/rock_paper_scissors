<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock Paper Scissors Game</title>
</head>
<body>
    <script src="./script.js" defer></script>
    <main>
        <div class="container">
            <div class="container-inner">

                <div class="result-field-wrapp">
                    <div class="result-field-inner">
                        <div class="result-field">
                            <div class="players-choices">
                                <div class="player-choice-field">Your choice: 
                                    <div class="player-choice"></div>
                                </div>
                                <div class="computer-choice-field">Computer choice:
                                    <div class="computer-choice"></div>
                                </div>
                            </div>

                            <div class="round-result-field">Round Result
                                <div class="result"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="buttons-wrap">
                    <div class="buttons-inner">
                        <div class="buttons">
                            <button class="rock"></button>
                            <button class="paper"></button>
                            <button class="scissors"></button>
                        </div>
                    </div>
                </div>

                <div class="scores-field-wrap">
                    <div class="scores-filed-inner">
                        <div class="scores">
                            <div class="player-scores">Your scores are:  0</div>
                            <div class="computer-scores">Computer scores are:  0</div>
                        </div>
                    </div>
                </div>


            </div>
        </div>
    </main>
    
</body>
</html>
